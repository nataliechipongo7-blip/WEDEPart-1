<!DOCTYPE html>
<html lang="en">
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     
     <title>Book a Custom Cake Enquiry | Candice Cakes Gugulethu</title>

     <meta name="description" content="Fill out our online cake order enquiry form at Candice Cakes. Choose your custom design options, sizes, and flavors to get a quick quote for your upcoming event.">

     <meta name="keywords" content="cake enquiry form, order custom cake online, cake quote Gugulethu, book birthday cake, custom cake options, cake order form">

     <link rel="stylesheet" href="CSS/main.css">
<body>

     <header>
          <a href="index.html"><img src="Images/logo.jpeg" alt="Candice Cakes Logo"></a>
          <h1>Candice Cakes</h1>
          <nav>
               <a href="index.html">Home</a>
               <a href="menu.html">Menu</a>
               <a href="about.html">About</a>
               <a href="contact.html">Contact</a>
               <a href="enquiry.html">Enquiry</a>
          </nav>
     </header>

     <main>
          <section class="enquiry-container">
               <h2>Enquiry Form</h2>
               <form class="enquiry-form">
                    <div class="form-group">
                         <label>Name</label>
                         <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                         <label>Email</label>
                         <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                         <label>Phone</label>
                         <input type="tel" placeholder="Your Phone Number" required>
                    </div>
                    <div class="form-group">
                         <label>Message</label>
                         <textarea placeholder="Tell us what you have in mind..."></textarea>
                    </div>

                    <hr>
                    <h2>Order Your Cake</h2>

                    <div class="form-group">
                         <label>Select Cake Flavor</label>
                         <select required>
                              <option value="">Choose a flavour</option>
                              <option>Chocolate</option>
                              <option>Vanilla</option>
                              <option>Red Velvet</option>
                              <option>Strawberry</option>
                         </select>
                    </div>

                    <div class="form-group">
                         <label>Select Cake Size</label>
                         <select required>
                              <option value="">Choose size</option>
                              <option>Small (6 inch)</option>
                              <option>Medium (8 inch)</option>
                              <option>Large (10 inch)</option>
                         </select>
                    </div>

                    <div class="form-group">
                         <label>Occasion</label>
                         <select required>
                              <option value="">Select Occasion</option>
                              <option>Birthday</option>
                              <option>Wedding</option>
                              <option>Anniversary</option>
                              <option>Graduation</option>
                              <option>Baby Shower</option>
                              <option>Other</option>
                         </select>
                    </div>

                    <div class="form-group">
                         <label>Date Needed</label>
                         <input type="date" required>
                    </div>

                    <div class="form-group">
                         <label>Delivery Option</label>
                         <div class="delivery-options">
                              <label class="radio-box"><input type="radio" name="delivery" value="delivery" required> Delivery</label>
                              <label class="radio-box"><input type="radio" name="delivery" value="collection"> Collection</label>
                         </div>
                    </div>

                    <button type="submit" class="order-button">Order Your Cake</button>
               </form>
          </section>
     </main>

     <footer>
          <p>© 2026 Candice Cakes</p>
     </footer>

</body>
</html>
